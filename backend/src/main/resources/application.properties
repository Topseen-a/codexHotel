# App name
spring.application.name=codexHotel

# Server port — Render (and most PaaS hosts) inject $PORT at runtime and route
# traffic to whatever the app binds to. Falls back to 8080 for local dev.
server.port=${PORT:8080}

# MongoDB connection
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/codexhotel}
spring.data.mongodb.database=codexhotel
# Build the @Indexed / @CompoundIndex indexes (e.g. unique email and room number) on startup.
spring.data.mongodb.auto-index-creation=true

# JWT
# IMPORTANT: override app.jwt.secret via an environment variable in every real deployment.
# The fallback below is only for local development and must never be used in production.
app.jwt.secret=${JWT_SECRET:change-this-dev-only-secret-please-set-JWT_SECRET-env-var-min-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — comma-separated origin patterns allowed to call the API (e.g. https://codexhotel.vercel.app).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Bootstrap admin (see DataSeeder) — created once on first run if no ADMIN exists yet.
app.seed.admin-email=${ADMIN_EMAIL:admin@codexhotel.com}
app.seed.admin-password=${ADMIN_PASSWORD:ChangeMe123!}

# Logging
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.security=INFO
